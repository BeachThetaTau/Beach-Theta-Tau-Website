name: Dependency audit

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Run npm audit (high and above)
        id: audit
        continue-on-error: true
        shell: bash
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee audit.txt
      - name: Publish job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## npm audit: production dependencies, high and above"
            echo
            echo '```text'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Flag findings
        if: ${{ steps.audit.outcome == 'failure' }}
        run: echo "::warning title=npm audit::Vulnerable production dependencies found. See the job summary."
